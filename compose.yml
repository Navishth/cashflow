services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: cashflow
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d cashflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  ml:
    build: ./ml-service
    environment:
      ML_API_KEY: ${ML_API_KEY:?Set ML_API_KEY in .env}
      MODEL_PATH: /app/artifacts/model.joblib
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/cashflow
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      ML_URL: http://ml:8001
      ML_API_KEY: ${ML_API_KEY}
      BIND_ADDRESS: 0.0.0.0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_PRODUCTION: ${APP_PRODUCTION:-false}
      MAIL_MODE: ${MAIL_MODE:-file}
      MAIL_DIRECTORY: /app/mail
      MAIL_FROM: ${MAIL_FROM:-hello@example.com}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_HEALTH_ENABLED: ${SMTP_HEALTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    volumes:
      - mail-spool:/app/mail
    networks: [private, edge]
    depends_on:
      db: { condition: service_healthy }
      ml: { condition: service_healthy }
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    networks: [edge]
    depends_on: [backend]
networks:
  private:
    internal: true
  edge: {}
volumes:
  postgres-data: {}
  mail-spool: {}
